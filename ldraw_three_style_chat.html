<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>three.js • LDrawLoader + Chat</title>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <style>
    body {
      font-family: Monospace;
      background-color: #000;
      color: #fff;
      margin: 0;
      overflow: hidden;
    }
    #info {
      color: #fff;
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 100;
      display: block;
    }
    #info a, .button { color: #f00; font-weight: bold; text-decoration: underline; cursor: pointer }
    /* chat overlay */
    .chat {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 101;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      max-width: 960px;
      margin: 0 auto;
    }
    .chat .log {
      grid-column: 1 / -1;
      max-height: 28vh;
      overflow: auto;
      background: rgba(0,0,0,0.55);
      border: 1px solid #333;
      padding: 6px;
      border-radius: 6px;
      backdrop-filter: blur(3px);
    }
    .msg {margin: 2px 0; font-size: 12px;}
    .you {color: #8be9fd}
    .sys  {color: #bd93f9}
    .chat input {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      padding: 8px;
      border-radius: 6px;
      font-family: inherit;
    }
    .chat button {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - LDrawLoader + Chat
  </div>

  <!-- three.js (classic scripts) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/LDrawLoader.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/exporters/GLTFExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

  <script>
    var container, camera, scene, renderer, pointLight, controls, gui, guiData, exporter;
    var model, textureCube;
    var envMapActivated = false;
    var basePath = 'https://hartswf0.github.io/ldrawExample/';
    var ldrawPath = basePath + 'models/ldraw/officialLibrary/'; // used by loader for parts

    var modelFileList = {
      'Car': 'models/car.ldr_Packed.mpd',
      'Lunar Vehicle': 'models/1621-1-LunarMPVVehicle.mpd_Packed.mpd',
      'Radar Truck': 'models/889-1-RadarTruck.mpd_Packed.mpd',
      'Trailer': 'models/4838-1-MiniVehicles.mpd_Packed.mpd',
      'Bulldozer': 'models/4915-1-MiniConstruction.mpd_Packed.mpd',
      'Helicopter': 'models/4918-1-MiniFlyers.mpd_Packed.mpd',
      'Plane': 'models/5935-1-IslandHopper.mpd_Packed.mpd',
      'Lighthouse': 'models/30023-1-Lighthouse.ldr_Packed.mpd',
      'X-Wing mini': 'models/30051-1-X-wingFighter-Mini.mpd_Packed.mpd',
      'AT-ST mini': 'models/30054-1-AT-ST-Mini.mpd_Packed.mpd',
      'AT-AT mini': 'models/4489-1-AT-AT-Mini.mpd_Packed.mpd',
      'Shuttle': 'models/4494-1-Imperial Shuttle-Mini.mpd_Packed.mpd',
      'TIE Interceptor': 'models/6965-1-TIEIntercep_4h4MXk5.mpd_Packed.mpd',
      'Star fighter': 'models/6966-1-JediStarfighter-Mini.mpd_Packed.mpd',
      'X-Wing': 'models/7140-1-X-wingFighter.mpd_Packed.mpd',
      'AT-ST': 'models/10174-1-ImperialAT-ST-UCS.mpd_Packed.mpd'
    };

    init();
    animate();

    function init() {
      container = document.createElement('div');
      document.body.appendChild(container);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
      camera.position.set(150, 200, 250);

      scene = new THREE.Scene();

      var ambientLight = new THREE.AmbientLight(0xcccccc, 0.4);
      scene.add(ambientLight);

      pointLight = new THREE.PointLight(0xffffff, 1);
      pointLight.position.set(-1000, 1200, 1500);
      scene.add(pointLight);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);

      guiData = { modelFileName: modelFileList['Car'], envMapActivated: false };
      gui = new dat.GUI({ width: 320 });
      var modelFolder = gui.addFolder("Model");
      modelFolder.add(guiData, 'modelFileName', modelFileList).name('Model').onFinishChange(function () { reloadObject(true); });
      modelFolder.add({ downloadGLB: downloadGLB }, 'downloadGLB').name('Download GLB');
      modelFolder.open();

      var graphicsFolder = gui.addFolder("Graphics");
      graphicsFolder.add(guiData, 'envMapActivated').name('Env. map').onChange(function (v) { envMapActivated = v; reloadObject(false); });
      graphicsFolder.open();

      window.addEventListener('resize', onWindowResize, false);

      exporter = new THREE.GLTFExporter();

      // CHAT UI
      setupChat();

      reloadObject(true);
    }

    function reloadObject(resetCamera) {
      if (model) scene.remove(model);
      model = null;

      var lDrawLoader = new THREE.LDrawLoader();
      lDrawLoader
        .setPath(ldrawPath)
        .load(basePath + guiData.modelFileName, function (group2) {
          if (model) scene.remove(model);
          model = group2;
          model.rotation.x = Math.PI; // LDraw coordinates

          scene.add(model);

          var materials = lDrawLoader.materials;

          if (envMapActivated) {
            if (!textureCube) {
              var r = "https://threejs.org/examples/textures/cube/Bridge2/";
              var urls = [ r + "posx.jpg", r + "negx.jpg", r + "posy.jpg", r + "negy.jpg", r + "posz.jpg", r + "negz.jpg" ];
              textureCube = new THREE.CubeTextureLoader().load(urls);
              textureCube.mapping = THREE.CubeReflectionMapping;
            }
            for (var i = 0, n = materials.length; i < n; i++) {
              var material = materials[i];
              if (material.userData && material.userData.canHaveEnvMap) material.envMap = textureCube;
            }
          }

          var bbox = new THREE.Box3().setFromObject(model);
          var size = bbox.getSize(new THREE.Vector3());
          var radius = Math.max(size.x, Math.max(size.y, size.z)) * 0.5;

          if (resetCamera) {
            controls.target0.copy(bbox.getCenter(new THREE.Vector3()));
            controls.position0.set(-2.3, 2, 2).multiplyScalar(radius).add(controls.target0);
            controls.reset();
          }

          pointLight.position.normalize().multiplyScalar(radius * 3);
        }, undefined, function (err) {
          logMsg('SYSTEM', 'Load error: ' + err.message);
        });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      render();
    }

    function render() {
      renderer.render(scene, camera);
    }

    // -------- GLB download ----------
    function downloadGLB() {
      if (!model) { logMsg('SYSTEM', 'Nothing to export'); return; }
      exporter.parse(model, function (gltf) {
        var blob = new Blob([gltf instanceof ArrayBuffer ? gltf : JSON.stringify(gltf)], { type: (gltf instanceof ArrayBuffer) ? 'model/gltf-binary' : 'model/gltf+json' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'model.glb'; a.click(); URL.revokeObjectURL(a.href);
      }, { binary: true });
      logMsg('SYSTEM', 'Exporting GLB…');
    }

    // ---------- Chat overlay ----------
    var chatEl, logEl, inputEl, sendBtn;
    function setupChat() {
      chatEl = document.createElement('div'); chatEl.className = 'chat';
      logEl = document.createElement('div'); logEl.className = 'log'; chatEl.appendChild(logEl);
      inputEl = document.createElement('input'); inputEl.placeholder = 'commands: load <url> | model <key> | env on/off | bg #000 | help | base <url>'; chatEl.appendChild(inputEl);
      sendBtn = document.createElement('button'); sendBtn.textContent = 'Send'; chatEl.appendChild(sendBtn);
      document.body.appendChild(chatEl);
      sendBtn.addEventListener('click', onSend);
      inputEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); onSend(); } });
      logMsg('SYSTEM', 'Ready. Base path: ' + basePath);
    }
    function logMsg(who, text) {
      var p = document.createElement('div'); p.className = 'msg ' + (who==='YOU'?'you':'sys'); p.textContent = who + ': ' + text; logEl.appendChild(p); logEl.scrollTop = logEl.scrollHeight;
    }
    function onSend() {
      var s = (inputEl.value || '').trim(); if (!s) return;
      logMsg('YOU', s); inputEl.value = '';
      var parts = s.split(/\s+/); var cmd = parts[0].toLowerCase(); var arg = parts.slice(1).join(' ');
      try {
        if (cmd === 'help') {
          logMsg('SYSTEM','Commands: model <Name|key from list> | load <full-url-or-relative> | env on|off | bg <#hex> | base <url> | download');
        } else if (cmd === 'model') {
          // try by label or by file path
          if (modelFileList[arg]) { guiData.modelFileName = modelFileList[arg]; }
          else {
            // find by case-insensitive label
            var found = null;
            for (var k in modelFileList) if (k.toLowerCase() === arg.toLowerCase()) { found = modelFileList[k]; break; }
            if (found) guiData.modelFileName = found; else guiData.modelFileName = arg;
          }
          logMsg('SYSTEM','Model → ' + guiData.modelFileName);
          reloadObject(true);
        } else if (cmd === 'load') {
          // full url or relative to basePath
          var url = arg;
          if (!/^https?:\/\//.test(url)) { guiData.modelFileName = url; }
          else { // convert to relative if base matches, else set base dynamic
            guiData.modelFileName = url.replace(basePath, '');
            if (guiData.modelFileName === url) { // no replace happened
              basePath = url.substring(0, url.lastIndexOf('/')+1);
              logMsg('SYSTEM', 'Base auto-set to ' + basePath);
              guiData.modelFileName = url.substring(basePath.length);
            }
          }
          reloadObject(true);
        } else if (cmd === 'env') {
          envMapActivated = (arg.toLowerCase() === 'on' || arg==='1' || arg==='true');
          guiData.envMapActivated = envMapActivated; reloadObject(false); logMsg('SYSTEM','Env map → ' + envMapActivated);
        } else if (cmd === 'bg') {
          document.body.style.backgroundColor = arg || '#000';
          logMsg('SYSTEM','Background → ' + (arg||'#000'));
        } else if (cmd === 'base') {
          if (/^https?:\/\//.test(arg)) { basePath = arg.replace(/[^\/]$/, '$&/'); logMsg('SYSTEM','Base path set to ' + basePath); }
          else { logMsg('SYSTEM','Provide full URL to set base'); }
        } else if (cmd === 'download') {
          downloadGLB();
        } else {
          logMsg('SYSTEM','Unknown command. type: help');
        }
      } catch (e) {
        logMsg('SYSTEM', 'Error: ' + e.message);
      }
    }
  </script>

  <!-- LDraw.org CC BY 2.0 Parts Library attribution -->
  <div style="display: block; position: absolute; bottom: 0px; right: 0px; width: 160px; padding: 2px; border: #838A92 1px solid; background-color: #F3F7F8;">
    <center>
      <a href="http://www.ldraw.org"><img style="width: 145px" src="https://www.ldraw.org/images/Stamp145.png" alt="LDraw.org logo"></a>
      <br />
      <a href="http://www.ldraw.org/">This software uses the LDraw Parts Library</a>
    </center>
  </div>
</body>
</html>
